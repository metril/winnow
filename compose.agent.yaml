# Remote SDR agent — runs ONLY the capture image in agent mode on a host that has
# the dongle. It enumerates local dongles, decodes locally, and streams readings to
# the main winnow app over an encrypted, mutually-authenticated WebSocket. No DB and
# no app run here; the main stack (compose.yaml) lives on the other host.
#
# Setup (see README "Remote SDRs"):
#   1. Set AGENT_URL in a `.env` next to this file (wss://<main-host>:8443/api/agent/ws).
#      AGENT_SERVER_KEY is OPTIONAL: leave it unset and the agent fetches+pins the
#      server's public key on first connect (trust-on-first-use). Set it only if you
#      want strict verification.
#   2. Start it:  docker compose -f compose.agent.yaml up -d
#   3. In the dashboard on the MAIN host (System → Remote agents) the agent shows up
#      under "Pending approval" — click Approve. It connects within seconds and its
#      dongles appear in the inventory/coverage. (No key copy/paste needed.)
#
# Both the agent identity key and the pinned server key persist in the named volume,
# so restarts don't need re-approving.
services:
  agent:
    image: ghcr.io/metril/winnow-capture:${WINNOW_TAG:-latest}
    restart: unless-stopped
    # The dongle must be visible to the container.
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      # Persists /data/agent.key — the agent's Curve25519 identity. Without this
      # the key regenerates on each restart and must be re-authorized.
      - winnow-agent-key:/data
    environment:
      # Required ------------------------------------------------------------
      AGENT_URL: ${AGENT_URL:?set to wss://<main-host>:8443/api/agent/ws}
      # Optional ------------------------------------------------------------
      AGENT_NAME: ${AGENT_NAME:-agent}            # namespaces this agent's sources in the dashboard
      AGENT_SERVER_KEY: ${AGENT_SERVER_KEY:-}     # leave unset for trust-on-first-use (fetched+pinned to /data); set for strict verification
      AGENT_SERVER_FINGERPRINT: ${AGENT_SERVER_FINGERPRINT:-}  # pin the outer TLS cert (from dashboard) — also authenticates the TOFU fetch
      # CAPTURE_SILENCE_TIMEOUT: 5m               # zero rtlamr output for this long = wedged SDR → pipeline restart (3 dead runs → container restart)
    # Optional CPU pinning on big.LITTLE SoCs (e.g. RK3588 performance cores "4-7").
    # Leave blank/omit on amd64 or uniform CPUs — a wrong cpuset starves rtlamr
    # ("not keeping up with rtl_tcp").
    cpuset: "${CAPTURE_CPUSET:-}"
volumes:
  winnow-agent-key:
