# winnow — db (TimescaleDB) + capture + worker (singleton) + app (API/SPA).
# Build context is the repo root for all Go services (shared module).
#
# Each Go service has both `image:` (the published multi-arch image on GHCR) and
# `build:` (local build). To run released images: `docker compose pull && up -d`
# (optionally pin a version with WINNOW_TAG=1.2.3). To build locally instead:
# `docker compose up --build` (also how CAPTURE_MOCK dev works).
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    # /dev/shm for Postgres parallel workers (dynamic shared memory). Docker
    # defaults a container to 64m, too small for parallel VACUUM/ANALYZE and
    # parallel queries over the readings hypertable — they fail with "could not
    # resize shared memory segment … No space left on device" (which is /dev/shm,
    # NOT the disk). Override with WINNOW_DB_SHM (e.g. 256m on a tight host).
    shm_size: "${WINNOW_DB_SHM:-1gb}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-winnow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-winnow}
      POSTGRES_DB: ${POSTGRES_DB:-winnow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-winnow} -d ${POSTGRES_DB:-winnow}"]
      interval: 5s
      timeout: 3s
      retries: 15

  capture:
    image: ghcr.io/metril/winnow-capture:${WINNOW_TAG:-latest}
    build: { context: ., dockerfile: capture/Dockerfile }
    restart: unless-stopped
    # Optional CPU pinning. rtlamr demodulates a real-time IQ stream and falls
    # behind ("not keeping up") if the scheduler parks it on slow cores. On a
    # big.LITTLE host, pin to the performance cluster, e.g. CAPTURE_CPUSET=4-7
    # (RK3588: cores 4-7 are the A76s). Empty = no pinning (default, portable).
    cpuset: "${CAPTURE_CPUSET:-}"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://winnow:winnow@db:5432/winnow}
      CAPTURE_MOCK: ${CAPTURE_MOCK:-0}
      RTL_DEVICES: ${RTL_DEVICES:-auto}
      RTLAMR_MSGTYPE: ${RTLAMR_MSGTYPE:-scm,scm+,idm}
      RTLAMR_FILTERID: ${RTLAMR_FILTERID:-}
      FREQ: ${FREQ:-912600155}
      GAIN: ${GAIN:-}
      PPM: ${PPM:-0}
    depends_on:
      db: { condition: service_healthy }
    # USB passthrough for the RTL-SDR dongle(s); see README for the host module
    # blacklist. If device rules are fussy, use `privileged: true` instead.
    devices:
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - "c 189:* rmw"
    # privileged: true

  worker:
    image: ghcr.io/metril/winnow-worker:${WINNOW_TAG:-latest}
    build: { context: ., dockerfile: worker/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://winnow:winnow@db:5432/winnow}
      # Optional bootstrap; real config is set in the dashboard (DB settings).
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_PREFIX: ${MQTT_PREFIX:-homeassistant}
    depends_on:
      db: { condition: service_healthy }

  app:
    image: ghcr.io/metril/winnow-app:${WINNOW_TAG:-latest}
    build: { context: ., dockerfile: app/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://winnow:winnow@db:5432/winnow}
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_PREFIX: ${MQTT_PREFIX:-homeassistant}
    ports:
      - "${APP_PORT:-8000}:8000"
      # Encrypted listener for remote capture agents (wss). The agent payload is
      # already app-layer-encrypted; this is the optional outer TLS.
      - "${AGENT_TLS_PORT:-8443}:8443"
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
